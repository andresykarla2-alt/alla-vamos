<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allá vamos ❤️</title>

<style>
body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#fff5f2,#ead5d9);
font-family:Georgia,serif;
color:#432733;
}

.card{
width:90%;
max-width:430px;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px #0002;
text-align:center;
}

h1{
font-size:40px;
font-weight:normal;
}

input{
width:100%;
padding:14px;
margin:8px 0;
box-sizing:border-box;
border:1px solid #dcc8cc;
border-radius:12px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:0;
border-radius:12px;
background:#704157;
color:white;
font-size:16px;
}

.secondary{
background:#eadcdf;
color:#603849;
}

.hidden{
display:none;
}

#mensaje,
#parejaMensaje{
margin-top:15px;
padding:10px;
word-break:break-word;
}

.success{
color:#28603d;
}

.error{
color:#8b3030;
}

.codigo{
font-size:30px;
font-family:monospace;
font-weight:bold;
letter-spacing:5px;
background:#f1e1e0;
padding:15px;
border-radius:15px;
margin:20px 0;
}

#app{
display:none;
width:100%;
}

.top{
text-align:center;
}

.heart{
font-size:50px;
}

.logout{
background:#e5d5d3;
color:#633d4b;
}
</style>
</head>

<body>

<div id="loginScreen" class="card">

<div class="heart">♥</div>

<h1>Allá vamos</h1>

<p>Nuestro pequeño lugar en el mundo</p>


<div id="login">

<h2>Entrar</h2>

<input
id="email"
type="email"
placeholder="Correo electrónico">

<input
id="password"
type="password"
placeholder="Contraseña">

<button id="entrar">
Entrar
</button>

<button id="crear" class="secondary">
Crear cuenta
</button>

</div>


<div id="registro" class="hidden">

<h2>Crear cuenta</h2>

<input
id="nombre"
placeholder="Tu nombre">

<input
id="emailRegistro"
type="email"
placeholder="Correo electrónico">

<input
id="passwordRegistro"
type="password"
placeholder="Contraseña">

<button id="registrar">
Crear mi cuenta
</button>

<button id="volver" class="secondary">
Volver
</button>

</div>


<div id="mensaje"></div>

</div>


<div id="app">

<div class="card">

<div class="top">

<div class="heart">♥</div>

<h1>Allá vamos</h1>

<p id="bienvenida"></p>

</div>


<h2>❤️ Nuestro espacio</h2>

<p>
Este es vuestro espacio privado.
</p>

<h3>Tu código de pareja</h3>

<p>
Comparte este código con tu pareja:
</p>

<div
id="codigo"
class="codigo">
CREANDO...
</div>


<h3>¿Tu pareja ya tiene un código?</h3>

<input
id="codigoPareja"
placeholder="Escribe el código">


<button id="vincular">
Vincular pareja
</button>

<div id="parejaMensaje"></div>


<button
id="cerrarSesion"
class="logout">
Cerrar sesión
</button>

</div>

</div>


<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/*
================================================
TUS DATOS DE SUPABASE
================================================
*/

const SUPABASE_URL =
"https://sezjcwghptpamqcbbsgk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NoDvovTUzD_np7sdK27d1w_fTpx-bCe";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let usuario=null;
let pareja=null;


/*
================================================
MOSTRAR REGISTRO
================================================
*/

document
.getElementById("crear")
.addEventListener(
"click",
()=>{

document
.getElementById("login")
.classList.add("hidden");

document
.getElementById("registro")
.classList.remove("hidden");

document
.getElementById("mensaje")
.textContent="";

}
);


/*
================================================
VOLVER AL LOGIN
================================================
*/

document
.getElementById("volver")
.addEventListener(
"click",
()=>{

document
.getElementById("registro")
.classList.add("hidden");

document
.getElementById("login")
.classList.remove("hidden");

}
);


/*
================================================
CREAR CUENTA
================================================
*/

document
.getElementById("registrar")
.addEventListener(
"click",
async()=>{

const mensaje=
document.getElementById("mensaje");

const boton=
document.getElementById("registrar");


const nombre=
document
.getElementById("nombre")
.value
.trim();


const email=
document
.getElementById("emailRegistro")
.value
.trim();


const password=
document
.getElementById("passwordRegistro")
.value;


if(!nombre){

mensaje.textContent=
"Escribe tu nombre.";

return;

}


if(!email){

mensaje.textContent=
"Escribe tu correo.";

return;

}


if(password.length<6){

mensaje.textContent=
"La contraseña debe tener al menos 6 caracteres.";

return;

}


boton.disabled=true;

boton.textContent=
"Creando cuenta...";


try{

const resultado=
await supabase.auth.signUp({

email:email,

password:password,

options:{
data:{
display_name:nombre
}
}

});


if(resultado.error){

throw resultado.error;

}


if(resultado.data.session){

usuario=
resultado.data.user;

await abrirAplicacion();

}else{

mensaje.textContent=
"Cuenta creada. Revisa tu correo para confirmar la cuenta. ❤️";

}


}catch(error){

console.error(error);

mensaje.textContent=
"ERROR DE SUPABASE: "+
error.message;

}finally{

boton.disabled=false;

boton.textContent=
"Crear mi cuenta";

}

}
);


/*
================================================
INICIAR SESIÓN
================================================
*/

document
.getElementById("entrar")
.addEventListener(
"click",
async()=>{

const mensaje=
document.getElementById("mensaje");

const email=
document
.getElementById("email")
.value
.trim();

const password=
document
.getElementById("password")
.value;


if(!email){

mensaje.textContent=
"Escribe tu correo.";

return;

}


if(!password){

mensaje.textContent=
"Escribe tu contraseña.";

return;

}


try{

const resultado=
await supabase.auth
.signInWithPassword({

email:email,

password:password

});


if(resultado.error){

throw resultado.error;

}


usuario=
resultado.data.user;

await abrirAplicacion();


}catch(error){

console.error(error);

mensaje.textContent=
"ERROR DE SUPABASE: "+
error.message;

}

}
);


/*
================================================
ABRIR APLICACIÓN
================================================
*/

async function abrirAplicacion(){

document
.getElementById("loginScreen")
.style.display="none";


document
.getElementById("app")
.style.display="block";


const nombre=
usuario.user_metadata?.display_name
||"";


document
.getElementById("bienvenida")
.textContent=
nombre
?
`Hola ${nombre} ❤️`
:
"Nuestro pequeño lugar en el mundo";


await cargarPareja();

}


/*
================================================
CARGAR PAREJA
================================================
*/

async function cargarPareja(){

try{

const resultado=
await supabase
.from("couple_members")
.select(`
couple_id,
couples (
code
)
`)
.eq(
"user_id",
usuario.id
)
.maybeSingle();


if(resultado.error){

throw resultado.error;

}


/*
=============================================
SI YA TIENE PAREJA
=============================================
*/

if(resultado.data){

pareja={
id:resultado.data.couple_id,
code:resultado.data.couples.code
};


document
.getElementById("codigo")
.textContent=
pareja.code;


return;

}


/*
=============================================
SI ES SU PRIMER INGRESO
=============================================
*/

const crearPareja=
await supabase.rpc(
"create_my_couple"
);


if(crearPareja.error){

throw crearPareja.error;

}


if(
!crearPareja.data ||
!crearPareja.data.length
){

throw new Error(
"La función no devolvió un código de pareja."
);

}


pareja={
id:
crearPareja.data[0].couple_id,

code:
crearPareja.data[0].invite_code
};


document
.getElementById("codigo")
.textContent=
pareja.code;


}catch(error){

console.error(error);

document
.getElementById("codigo")
.textContent=
"ERROR";

document
.getElementById("parejaMensaje")
.textContent=
"Error: "+
error.message;

}

}


/*
================================================
VINCULAR PAREJA
================================================
*/

document
.getElementById("vincular")
.addEventListener(
"click",
async()=>{

const mensaje=
document.getElementById("parejaMensaje");

const codigo=
document
.getElementById("codigoPareja")
.value
.trim()
.toUpperCase();


if(!codigo){

mensaje.textContent=
"Escribe el código de tu pareja.";

return;

}


try{

const resultado=
await supabase.rpc(
"join_couple_by_code",
{
invite_code:codigo
}
);


if(resultado.error){

throw resultado.error;

}


if(
!resultado.data ||
!resultado.data.length
){

throw new Error(
"No se pudo vincular la cuenta."
);

}


pareja={
id:
resultado.data[0].couple_id,

code:
codigo
};


document
.getElementById("codigo")
.textContent=
codigo;


mensaje.className=
"success";

mensaje.textContent=
"¡Las cuentas están vinculadas! ❤️";


}catch(error){

console.error(error);

mensaje.className=
"error";

mensaje.textContent=
"ERROR: "+
error.message;

}

}
);


/*
================================================
CERRAR SESIÓN
================================================
*/

document
.getElementById("cerrarSesion")
.addEventListener(
"click",
async()=>{

await supabase.auth.signOut();

location.reload();

}
);


/*
================================================
COMPROBAR SESIÓN EXISTENTE
================================================
*/

const sesion=
await supabase.auth.getSession();


if(sesion.data.session){

usuario=
sesion.data.session.user;

await abrirAplicacion();

}

</script>

</body>
</html>
