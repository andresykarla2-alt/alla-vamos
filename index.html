<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allá vamos ❤️</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#fff5f2,#ead5d9);
  font-family:Georgia,serif;
  color:#432733;
}

.card{
  width:90%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:25px;
  box-shadow:0 10px 30px #0002;
  text-align:center;
}

h1{
  font-size:40px;
  font-weight:normal;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  box-sizing:border-box;
  border:1px solid #dcc8cc;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#704157;
  color:white;
  font-size:16px;
}

.secondary{
  background:#eadcdf;
  color:#603849;
}

.hidden{
  display:none;
}

#mensaje{
  margin-top:15px;
  color:#704157;
}
</style>
</head>

<body>

<div class="card">

<div style="font-size:50px">♥</div>

<h1>Allá vamos</h1>

<p>Nuestro pequeño lugar en el mundo</p>

<div id="login">

<h2>Entrar</h2>

<input id="email" type="email" placeholder="Correo electrónico">

<input id="password" type="password" placeholder="Contraseña">

<button id="entrar">
Entrar
</button>

<button id="crear" class="secondary">
Crear cuenta
</button>

</div>


<div id="registro" class="hidden">

<h2>Crear cuenta</h2>

<input id="nombre" placeholder="Tu nombre">

<input id="emailRegistro" type="email" placeholder="Correo electrónico">

<input id="passwordRegistro" type="password" placeholder="Contraseña">

<button id="registrar">
Crear mi cuenta
</button>

<button id="volver" class="secondary">
Volver
</button>

</div>

<div id="mensaje"></div>

</div>


<script>

document.getElementById("crear").addEventListener("click",function(){

document.getElementById("login").classList.add("hidden");

document.getElementById("registro").classList.remove("hidden");

document.getElementById("mensaje").textContent="";

});


document.getElementById("volver").addEventListener("click",function(){

document.getElementById("registro").classList.add("hidden");

document.getElementById("login").classList.remove("hidden");

});


document.getElementById("entrar").addEventListener("click",function(){

document.getElementById("mensaje").textContent=
"El botón Entrar funciona correctamente ❤️";

});


document.getElementById("registrar").addEventListener("click",function(){

const nombre=
document.getElementById("nombre").value.trim();

const email=
document.getElementById("emailRegistro").value.trim();

const password=
document.getElementById("passwordRegistro").value;


if(!nombre || !email || !password){

document.getElementById("mensaje").textContent=
"Completa todos los campos.";

return;

}


document.getElementById("mensaje").textContent=
"¡El registro funciona correctamente, "+nombre+"! ❤️";

});

</script>

</body>
</html>
